      concilia_backup: [SELECT]
    column_privileges:
      concilia_app:
        UPDATE: [confirmed_at, discarded_at, error_code, row_count, status, void_reason, voided_at]
      concilia_worker:
        UPDATE: [confirmed_at, discarded_at, error_code, row_count, status, void_reason, voided_at]

