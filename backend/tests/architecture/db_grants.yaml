      concilia_backup: [SELECT]
    column_privileges:
      concilia_app:
        UPDATE: [detraction_rates_bp, name, tolerance_bp, tolerance_min_cents]
      concilia_worker:
        UPDATE: [detraction_rates_bp, name, tolerance_bp, tolerance_min_cents]

  memberships:
