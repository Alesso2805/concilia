tables:
  alembic_version:
    rls: none
    privileges:
      concilia_backup: [SELECT]

  users:
    rls: none
    privileges:
      concilia_app: [INSERT, SELECT]
      concilia_backup: [SELECT]
    column_privileges:
      concilia_app:
        UPDATE: [display_name, password_hash]
      concilia_worker:
        SELECT: [display_name, id]

  sessions:
    rls: none
    privileges:
      concilia_app: [DELETE, INSERT, SELECT, UPDATE]
      concilia_backup: [SELECT]

  rate_limits:
    rls: none
    privileges:
      concilia_app: [DELETE, INSERT, SELECT, UPDATE]
      concilia_backup: [SELECT]

  organizations:
