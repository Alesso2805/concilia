[project]
name = "concilia"
version = "0.1.0"
description = "Bank reconciliation backoffice with maker-checker approval and an AI assistant that suggests but never decides."
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "asyncpg>=0.32",
    "defusedxml>=0.7.1",
    "fastapi>=0.163.1",
    "openai>=3.51.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170",
    "import-linter>=2.16",
    "mypy>=2.4",
    "pip-audit>=2.10",
    "pytest>=9.2",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
    "testcontainers[postgres]>=4.15",
    "time-machine>=3.6",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "ERA",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TID",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603", "S608"]
"migrations/versions/**" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["concilia", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "migrations/env.py"]
mypy_path = ["src", "."]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.alembic]
script_location = "%(here)s/migrations"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true
filterwarnings = ["error"]
