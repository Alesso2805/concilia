name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest
      - name: OpenAPI contract is up to date
        run: |
          uv run python -m concilia.openapi openapi.json
          test -z "$(git status --porcelain openapi.json)"
      - name: Audit Python dependencies
        run: |
          uv export --format requirements-txt --no-emit-project --all-groups --quiet -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API client is up to date
        run: |
          npm run generate:api
          test -z "$(git status --porcelain src/app/api)"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - run: npm audit --audit-level=high

  compose:
    runs-on: ubuntu-latest
    env:
      E2E_EMAIL: e2e@example.com
      E2E_PASSWORD: a-local-e2e-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up --build --detach
      - name: API answers through Caddy over HTTPS
        run: curl --fail --silent --insecure --retry 30 --retry-all-errors --retry-delay 2 https://localhost/api/health
      - name: Caddy serves the Angular app
        run: curl --fail --silent --insecure --output /dev/null https://localhost/
      - name: Create the end-to-end organization
        run: >-
          printf '%s\n' "$E2E_PASSWORD" |
          docker compose run -T --rm migrator python -m concilia.cli create-org
          --name "Comercial Andina" --email "$E2E_EMAIL" --display-name "Ana Torres" --password-stdin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Playwright and axe against the running stack
        run: npm run e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
      - name: Worker processes the scheduled cleanup job
        run: |
          for _ in $(seq 30); do
            status=$(docker compose exec -T db psql -U postgres -d concilia -Atc "SELECT status FROM jobs WHERE kind = 'cleanup' LIMIT 1")
            [ "$status" = "done" ] && exit 0
            sleep 2
          done
          exit 1
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  ci:
    if: always()
    needs: [backend, frontend, compose]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All required jobs passed"
